name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean
        run: rm -rf dist

      - name: Build
        run: npm run build

      - name: Ensure index.html
        run: cp dist/component-preview.html dist/index.html 2>/dev/null || true

      - name: Verify build
        run: |
          echo "=== Files in dist ==="
          ls -la dist/
          echo "=== Token check ==="
          grep -o 'pat_[A-Za-z0-9_]*' dist/assets/*.js | head -3 || echo "No token found"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
